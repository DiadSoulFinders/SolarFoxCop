name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Initialize and build
        run: |
          mkdir -p www
          cp index.html www/index.html

          cat << 'CONFIG' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.diadsoul.solarfox" version="1.0.0" xmlns="http://www.w3.org/ns/widgets">
              <name>SolarFoxCop</name>
              <description>Audio Tag Editor</description>
              <author email="dev@solarfox" href="">SolarFox Team</author>
              <content src="index.html" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <platform name="android" />
          </widget>
          CONFIG

          cordova platform add android
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-android-permissions
          cordova build android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
