<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarFox Tag Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 16px; max-width: 450px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; font-size: 1.4rem; }
    .upload-btn { display: block; width: 100%; text-align: center; padding: 12px; background: #3b82f6; color: #fff; font-weight: bold; border-radius: 10px; cursor: pointer; margin-bottom: 20px; }
    input[type="file"] { display: none; }
    .cover-container { text-align: center; margin-bottom: 15px; }
    .cover-preview { width: 140px; height: 140px; border-radius: 12px; object-fit: cover; background: #334155; border: 2px dashed #475569; display: inline-block; }
    .cover-btn { margin-top: 8px; display: inline-block; padding: 6px 12px; background: #475569; font-size: 0.8rem; border-radius: 6px; cursor: pointer; }
    audio { width: 100%; margin: 15px 0; border-radius: 8px; }
    .input-group { margin-bottom: 12px; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 4px; }
    input[type="text"] { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; outline: none; }
    .save-btn { width: 100%; padding: 14px; background: #10b981; color: #fff; font-weight: bold; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .save-btn:disabled { background: #334155; cursor: not-allowed; }
    .status { margin-top: 10px; text-align: center; font-size: 0.85rem; color: #38bdf8; }
  </style>
</head>
<body>

<div class="card">
  <h2>SolarFox Audio Editor</h2>

  <label class="upload-btn">
    🎵 Выбрать MP3 песню
    <input type="file" id="audioInput" accept="audio/mp3,audio/*">
  </label>

  <div class="cover-container">
    <img id="coverPreview" class="cover-preview" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='1'><rect x='4' y='4' width='16' height='16' rx='2'/><circle cx='12' cy='12' r='3'/></svg>">
    <br>
    <label class="cover-btn">
      🖼️ Изменить обложку
      <input type="file" id="coverInput" accept="image/*">
    </label>
  </div>

  <audio id="audioPlayer" controls></audio>

  <div class="input-group">
    <label>Название трека</label>
    <input type="text" id="titleInput" placeholder="Название песни">
  </div>

  <div class="input-group">
    <label>Исполнитель / Автор</label>
    <input type="text" id="artistInput" placeholder="Имя артиста">
  </div>

  <button id="saveBtn" class="save-btn" disabled>💾 Сохранить копию в память</button>
  <div id="statusText" class="status"></div>
</div>

<script>
  let currentFile = null;

  const audioInput = document.getElementById('audioInput');
  const coverInput = document.getElementById('coverInput');
  const audioPlayer = document.getElementById('audioPlayer');
  const titleInput = document.getElementById('titleInput');
  const artistInput = document.getElementById('artistInput');
  const coverPreview = document.getElementById('coverPreview');
  const saveBtn = document.getElementById('saveBtn');
  const statusText = document.getElementById('statusText');

  // Запрос разрешений при старте приложения
  document.addEventListener('deviceready', () => {
    const permissions = cordova.plugins.permissions;
    permissions.requestPermission(
      permissions.WRITE_EXTERNAL_STORAGE,
      () => console.log("Права получены"),
      () => console.log("Права отклонены")
    );
  }, false);

  audioInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    currentFile = file;
    audioPlayer.src = URL.createObjectURL(file);

    const fileName = file.name.replace(/\.[^/.]+$/, "");
    if (fileName.includes(" - ")) {
      const parts = fileName.split(" - ");
      artistInput.value = parts[0].trim();
      titleInput.value = parts[1].trim();
    } else {
      titleInput.value = fileName;
      artistInput.value = "Неизвестный исполнитель";
    }
    saveBtn.disabled = false;
    statusText.textContent = "Файл загружен";
  });

  coverInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    coverPreview.src = URL.createObjectURL(file);
  });

  saveBtn.addEventListener('click', () => {
    if (!currentFile) return;

    const artist = artistInput.value.trim() || "Artist";
    const title = titleInput.value.trim() || "Track";
    const cleanFileName = `${artist} - ${title}.mp3`;

    statusText.textContent = "Сохранение...";

    // Если приложение работает в среде Cordova на Android
    if (window.resolveLocalFileSystemURL) {
      window.resolveLocalFileSystemURL(cordova.file.externalDataDirectory || cordova.file.dataDirectory, (dir) => {
        dir.getFile(cleanFileName, { create: true, exclusive: false }, (fileEntry) => {
          fileEntry.createWriter((fileWriter) => {
            fileWriter.onwriteend = () => {
              statusText.textContent = "✅ Сохранено в папку приложения!";
              alert("Файл успешно сохранен: " + cleanFileName);
            };
            fileWriter.onerror = (e) => {
              statusText.textContent = "Ошибка записи: " + e.toString();
            };
            fileWriter.write(currentFile);
          });
        }, (err) => {
          statusText.textContent = "Ошибка создания файла";
        });
      });
    } else {
      // Запасной вариант для браузера
      const url = URL.createObjectURL(currentFile);
      const a = document.createElement('a');
      a.href = url;
      a.download = cleanFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      statusText.textContent = "✅ Скачано в Загрузки!";
    }
  });
</script>

</body>
</html>
